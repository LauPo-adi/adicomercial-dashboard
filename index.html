#login-screen::before{content:'';position:absolute;inset:0;background:rgba(26,26,26,.62);backdrop-filter:blur(1px)}
.login-card{position:relative;z-index:1}
.login-card{background:white;border-radius:24px;padding:44px;width:400px;box-shadow:var(--shadow-lg);animation:fadeIn .4s ease}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--na),#c44f10);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 20px rgba(232,97,26,.35)}
.login-logo h1{font-size:22px;font-weight:800;color:var(--gr);letter-spacing:-.03em}
.login-logo p{font-size:12px;color:var(--gr-m);margin-top:3px;font-weight:500;letter-spacing:.02em}
.login-label{font-size:11px;font-weight:700;color:var(--gr);margin-bottom:7px;display:block;text-transform:uppercase;letter-spacing:.07em}
.login-select,.login-input{width:100%;padding:12px 15px;border:1.5px solid #E4E4E4;border-radius:10px;font-family:var(--font);font-size:14px;background:white;color:var(--gr);margin-bottom:16px;transition:border-color .2s,box-shadow .2s}
.login-select:focus,.login-input:focus{outline:none;border-color:var(--na);box-shadow:0 0 0 3px rgba(232,97,26,.1)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--na),var(--na-d));color:white;border:none;border-radius:10px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:6px;letter-spacing:.01em;box-shadow:0 4px 14px rgba(232,97,26,.4)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(232,97,26,.5)}
.login-btn:active{transform:translateY(0)}
.login-error{color:var(--ro);font-size:12px;margin-top:8px;text-align:center;display:none;font-weight:600}

/* ── TOPBAR ── */
#app{display:none;flex-direction:column;min-height:100vh}
.app-body-wrap{display:flex;flex-direction:column;flex:1}
.topbar{background:var(--gr-dark);color:white;padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99;border-bottom:1px solid rgba(255,255,255,.06)}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--na),var(--na-d));border-radius:9px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(232,97,26,.4)}
.topbar-title{font-size:14px;font-weight:700;letter-spacing:-.02em}
.topbar-role{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:700;margin-left:4px;letter-spacing:.03em;text-transform:uppercase}
.role-admin{background:rgba(255,255,255,.12);color:white}
.role-owner{background:#FEF3DC;color:#7B5800}
.role-vendor{background:var(--ve-c);color:var(--ve)}
.role-marketing{background:var(--az-c);color:var(--az)}
.role-firmas{background:var(--pu-c);color:var(--pu)}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:13px;color:rgba(255,255,255,.6);font-weight:500}
.topbar-logout{font-size:11px;padding:5px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:none;color:rgba(255,255,255,.6);cursor:pointer;font-family:var(--font);font-weight:600;transition:all .2s;letter-spacing:.02em}
.topbar-logout:hover{background:rgba(255,255,255,.1);color:white;border-color:rgba(255,255,255,.4)}

/* ── LAYOUT ── */
.app-body{display:flex;flex:1}
.sidebar{width:228px;background:white;border-right:1px solid #EAEAEA;flex-shrink:0;padding:16px 0;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
.sidebar-section{padding:0 12px;margin-bottom:4px}
.sidebar-label{font-size:10px;font-weight:700;color:var(--gr-m);text-transform:uppercase;letter-spacing:.1em;padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--gr);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--gr-c);color:var(--gr)}
.nav-item.active{background:var(--na-light);color:var(--na-d);font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:18px;background:var(--na);border-radius:0 3px 3px 0}
.nav-icon{font-size:15px;width:20px;text-align:center}
.nav-badge{background:var(--ro);color:white;font-size:9px;font-weight:800;padding:1px 5px;border-radius:20px;min-width:16px;text-align:center;margin-left:auto}
.main{flex:1;padding:24px;overflow-x:auto;animation:fadeIn .2s ease}

/* ── CARDS & KPIS ── */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:16px}
.kcard{background:white;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);transition:box-shadow .2s;border:1px solid rgba(0,0,0,.04)}
.kcard:hover{box-shadow:var(--shadow-md)}
.kcard-label{font-size:11px;color:var(--gr-m);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kcard-val{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.03em}
.kcard-sub{font-size:11px;margin-top:5px;color:var(--gr-m);font-weight:500}
.kcard.green .kcard-val{color:var(--ve)}.kcard.green .kcard-sub{color:var(--ve)}
.kcard.orange .kcard-val{color:var(--na)}.kcard.orange .kcard-sub{color:var(--na-d)}
.kcard.blue .kcard-val{color:var(--az)}.kcard.blue .kcard-sub{color:var(--az)}
.kcard.red .kcard-val{color:var(--ro)}.kcard.red .kcard-sub{color:var(--ro)}
.kcard.gold .kcard-val{color:var(--am)}.kcard.gold .kcard-sub{color:var(--am)}
.kcard.purple .kcard-val{color:var(--pu)}.kcard.purple .kcard-sub{color:var(--pu)}
.card{background:white;border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid rgba(0,0,0,.04)}
.card-title{font-size:11px;font-weight:700;color:var(--gr-m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:900px){.g2{grid-template-columns:1fr}.sidebar{display:none}}

/* ── TABLA ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--gr-c);padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--gr-m);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid #EAEAEA}
.tbl td{padding:9px 12px;border-bottom:1px solid #F5F4F2;color:var(--gr);vertical-align:middle}
.tbl tr:hover td{background:#FAFAFA}
.tbl .num{text-align:right;font-family:var(--mono);font-size:12px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;display:inline-block;letter-spacing:.02em}
.badge-green{background:var(--ve-c);color:var(--ve)}
.badge-orange{background:var(--na-c);color:var(--na-d)}
.badge-blue{background:var(--az-c);color:var(--az)}
.badge-red{background:var(--ro-c);color:var(--ro)}
.badge-purple{background:var(--pu-c);color:var(--pu)}
.badge-gold{background:var(--am-c);color:var(--am)}

/* ── BARRA PROGRESO ── */
.pb-wrap{display:flex;align-items:center;gap:8px}
.pb{flex:1;height:6px;background:#EBEBEB;border-radius:3px;overflow:hidden}
.pb-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.pb-green{background:linear-gradient(90deg,#1E6B2E,#2D9E41)}.pb-orange{background:linear-gradient(90deg,#E8611A,#F0842E)}.pb-red{background:linear-gradient(90deg,#B71C1C,#D32F2F)}

/* ── UPLOAD ── */
.upload-zone{border:2px dashed #D0D0D0;border-radius:var(--r);padding:32px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:14px}
.upload-zone:hover,.upload-zone.drag{border-color:var(--na);background:var(--na-light)}
.upload-zone h3{font-size:14px;font-weight:700;color:var(--na);margin-bottom:5px}
.upload-zone p{font-size:12px;color:var(--gr-m)}
.upload-ok{background:var(--ve-light);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ve);font-weight:600;display:none;margin-bottom:12px;border:1px solid var(--ve-c)}
.upload-err{background:var(--ro-c);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ro);font-weight:600;display:none;margin-bottom:12px}

/* ── TAREAS / COMENTARIOS ── */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #F5F4F2}
.task-item:last-child{border-bottom:none}
.task-cb{width:18px;height:18px;border-radius:5px;border:2px solid #D0D0D0;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.task-cb.done{background:var(--ve);border-color:var(--ve);color:white}
.task-body{flex:1;min-width:0}
.task-text{font-size:13px;color:var(--gr);line-height:1.4;font-weight:500}
.task-text.done-text{text-decoration:line-through;color:var(--gr-m);font-weight:400}
.task-meta{font-size:11px;color:var(--gr-m);margin-top:3px}
.task-del{font-size:11px;color:#ccc;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:4px;transition:all .15s}
.task-del:hover{color:var(--ro);background:var(--ro-c)}
.comment-item{background:var(--gr-c);border-radius:10px;padding:12px 14px;margin-bottom:8px;border:1px solid rgba(0,0,0,.04)}
.comment-who{font-size:11px;font-weight:700;color:var(--na);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.comment-text{font-size:13px;color:var(--gr);line-height:1.5}
.comment-time{font-size:10px;color:var(--gr-m);margin-top:4px}
.input-row{display:flex;gap:8px;margin-top:12px}
.input-row input,.input-row select{flex:1;padding:9px 12px;border:1.5px solid #E4E4E4;border-radius:8px;font-family:var(--font);font-size:13px;transition:border-color .2s,box-shadow .2s}
.input-row input:focus,.input-row select:focus{outline:none;border-color:var(--na);box-shadow:0 0 0 3px rgba(232,97,26,.1)}
.btn-sm{padding:9px 14px;background:var(--na);color:white;border:none;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.btn-sm:hover{background:var(--na-d);transform:translateY(-1px)}
.btn-sec{background:var(--gr-c);color:var(--gr);margin-left:6px}
.btn-sec:hover{background:#E0E0E0;transform:translateY(-1px)}

/* ── SECTION HEADER ── */
.section-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.section-hdr h2{font-size:20px;font-weight:800;color:var(--gr);letter-spacing:-.03em}
.section-hdr p{font-size:12px;color:var(--gr-m);margin-top:3px;font-weight:500}

/* ── AVATAR ── */
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;letter-spacing:.02em}
.av1{background:var(--az-c);color:var(--az)}
.av2{background:var(--pu-c);color:var(--pu)}
.av3{background:var(--ve-c);color:var(--ve)}
.av4{background:var(--am-c);color:var(--am)}
.av5{background:var(--na-c);color:var(--na-d)}

/* ── SELECTOR MES ── */
.mes-sel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.mes-chip{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;border:1.5px solid #E4E4E4;background:white;cursor:pointer;color:var(--gr-m);transition:all .15s;letter-spacing:.02em}
.mes-chip.active{background:var(--na);border-color:var(--na);color:white;box-shadow:0 2px 8px rgba(232,97,26,.3)}
.mes-chip:hover:not(.active){border-color:var(--na);color:var(--na)}

/* ── PANEL ── */
.panel{display:none}.panel.active{display:block}

/* ── STOCK ── */
.stock-bar{height:12px;background:#EBEBEB;border-radius:6px;overflow:hidden;margin-top:4px}
.stock-fill{height:100%;border-radius:6px}

/* ── RANKING VENDEDORES ── */
.rank-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:6px;background:var(--gr-c);transition:all .15s}
.rank-item:hover{background:#ECEAE8}
.rank-num{font-size:18px;font-weight:800;color:var(--gr-m);min-width:24px;font-family:var(--mono)}
.rank-num.gold{color:#C8A000}
.rank-num.silver{color:#888}
.rank-num.bronze{color:#A05C35}

/* ── ALERTA CRÍTICA ── */
.alerta{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:600}
.alerta-red{background:var(--ro-c);color:var(--ro);border:1px solid rgba(183,28,28,.15)}
.alerta-orange{background:var(--na-c);color:var(--na-d);border:1px solid rgba(232,97,26,.2)}
.alerta-green{background:var(--ve-light);color:var(--ve);border:1px solid rgba(30,107,46,.15)}

/* ── DIVIDER ── */
.divider{height:1px;background:#F0EEEC;margin:12px 0}

/* ── TOOLTIP hint ── */
.hint{font-size:11px;color:var(--gr-m);margin-top:6px;font-style:italic}
</style>
</head>

// ══════════════════════════════════════════════════════════
// SYNC: cargar todo desde Supabase al iniciar
// ══════════════════════════════════════════════════════════
async function loadFromSupabase(){
  showSync(false);
  try {
    // Ventas
    const ventas = await sbGet('ventas', '?select=*');
    if(ventas.length){
      DB.meses = {}; DB.mesas = {}; DB.meses_cargados = [];
      ventas.forEach(v=>{
        if(!DB.meses[v.mes]) DB.meses[v.mes] = { ventas:[], resumen:{} };
        DB.meses[v.mes].resumen[v.vendedor] = v.cantidad;
        if(!DB.meses[v.mes].resumen.adi) DB.meses[v.mes].resumen.adi = v.adi;
        if(!DB.metas[v.mes]) DB.metas[v.mes] = {};
        DB.metas[v.mes][v.vendedor] = v.meta;
        if(!DB.meses_cargados.includes(v.mes)) DB.meses_cargados.push(v.mes);
      });
      const ORDER = ['Ene 26','Feb 26','Mar 26','Abr 26','May 26','Jun 26','Jul 26','Ago 26'];
      DB.meses_cargados.sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
    }

    // Rescisiones
    const rescs = await sbGet('rescisiones', '?select=*');
    rescs.forEach(r=>{ DB.rescisiones[r.mes] = { total:r.total, neteadas:r.neteadas }; });

    // Stock
    const stocks = await sbGet('stock', '?select=*');
    if(stocks.length){
      stocks.forEach(s=>{ DB.stock[s.clave] = s.disponibles; });
    }

    // Tareas
    const tareas = await sbGet('tareas', '?select=*&order=id.asc');
    if(tareas.length) DB.tareas = tareas;

    // Comentarios
    const coms = await sbGet('comentarios', '?select=*&order=id.asc');
    if(coms.length) DB.comentarios = coms;

    saveDB();
    showSync(true);
    console.log('✓ Datos cargados desde Supabase');
  } catch(e){
    console.warn('Supabase load failed, using local data:', e);
    showSync(false);
  }
}

// Precio promedio Tipuana del mes (para calcular descuento por neteable)
function getPrecioPromTipuana(mes){
  const fin = FIN_LOTEO[mes];
  if(!fin) return 27000000;
  const t1 = fin['TIPUANA']?.precio_prom || 0;
  const t2 = fin['TIPUANA 2']?.precio_prom || 0;
  const c1 = fin['TIPUANA']?.cant || 0;
  const c2 = fin['TIPUANA 2']?.cant || 0;
  if(c1+c2 === 0) return t2 || t1 || 27000000;
  return Math.round((t1*c1 + t2*c2) / (c1+c2));
}

// Cuotas pagadas estimadas desde diferencia de fechas Excel (1 mes = 30.44 dias)
function cuotasPagadas(fecha_venta, fecha_resc){
  const dias = fecha_resc - fecha_venta;
  return Math.max(0, Math.floor(dias / 30.44));
}

// Vendidos acumulados = total del desarrollo - disponibles actuales (calculado dinámico)
// Así cuando gerencia actualiza el stock, el vendido se recalcula solo
function getVendidosAcum(key){
  const info = LOTEOS_TOTALES[key];
  if(!info || !info.total) return 0;
  const disp = DB.stock[key] || 0;
  return info.total - disp;
}

// Ventas del mes por loteo desde los datos históricos del Excel
function ensureVPL(){
  if(DB.ventas_por_loteo && Object.keys(DB.ventas_por_loteo).length > 0) return;
  DB.ventas_por_loteo = {
    'TIP 2':    {vendidos_mes:{'Ene 26':83,'Feb 26':34,'Mar 26':11,'Abr 26':18,'May 26':6}},
    'NOGAL':    {vendidos_mes:{'Ene 26':4, 'Feb 26':2, 'Mar 26':7, 'Abr 26':7, 'May 26':1}},
    'N ALIS 3': {vendidos_mes:{'Ene 26':4, 'Feb 26':3, 'Mar 26':1, 'Abr 26':6, 'May 26':0}},
    'JACA':     {vendidos_mes:{'Ene 26':30,'Feb 26':5, 'Mar 26':6, 'Abr 26':1, 'May 26':0}},
    'BVD':      {vendidos_mes:{'Ene 26':11,'Feb 26':3, 'Mar 26':0, 'Abr 26':4, 'May 26':0}},
    'BOSQUE':   {vendidos_mes:{'Ene 26':4, 'Feb 26':3, 'Mar 26':1, 'Abr 26':1, 'May 26':0}},
    'N ALIS 2': {vendidos_mes:{'Ene 26':0, 'Feb 26':0, 'Mar 26':2, 'Abr 26':0, 'May 26':0}},
  };
  saveDB();
}
function getTotalMes(mes){ return VENDEDORES.reduce((s,v)=>s+getVentas(v,mes),0); }
function getADI(mes){ return DB.meses?.[mes]?.resumen?.adi||0; }

function pb(val,max,label=''){
  const pct=Math.min(100,max?Math.round(val/max*100):0);
  const cl=pct>=100?'pb-green':pct>=65?'pb-orange':'pb-red';
  return `<div class="pb-wrap"><div class="pb"><div class="pb-fill ${cl}" style="width:${pct}%"></div></div><span style="font-size:11px;font-family:var(--mono);min-width:36px;text-align:right;color:var(--gr-m)">${pct}%</span></div>`;
}

let chartInstances={};
function destroyChart(id){ if(chartInstances[id]){chartInstances[id].destroy();delete chartInstances[id];} }
function makeChart(id,config){
  destroyChart(id);
  const canvas=document.getElementById(id);
  if(!canvas)return;
  chartInstances[id]=new Chart(canvas,config);
}

// Update banner title when panel changes
function updateBannerTitle(pid){
  const titles={resumen:'Resumen General',vendedores:'Por Vendedor',financiero:'Panel Financiero',
    rescisiones:'Rescisiones',anual:'Vista Anual',stock:'Stock de Loteos',tareas:'Tareas del Equipo',
    comentarios:'Comentarios','mi-mes':'Mi Mes','mis-tareas':'Mis Tareas',
    'comentarios-v':'Comentarios','marketing-panel':'Panel Marketing',
    'firmas-panel':'Panel Firmas','cargar':'Cargar Excel'};
  const el=document.getElementById('banner-title');
  if(el) el.textContent=titles[pid]||'Dashboard Comercial';
}

function showPanel(pid){
  updateBannerTitle(pid);
  currentPanel=pid;
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.id==='nav-'+pid);
  });
  const main=document.getElementById('main-content');
  main.innerHTML='';
  // Limpiar charts
  Object.keys(chartInstances).forEach(id=>destroyChart(id));
  const role=currentUser.role;
  if(pid==='resumen'){ if(currentUser.role==='owner') renderOwnerResumen(main); else renderResumen(main); }
  else if(pid==='vendedores') renderVendedores(main);
  else if(pid==='financiero') renderFinanciero(main);
  else if(pid==='rescisiones') renderRescisiones(main);
  else if(pid==='anual') renderAnual(main);
  else if(pid==='stock') renderStock(main);
  else if(pid==='tareas') renderTareas(main);
  else if(pid==='comentarios') renderComentarios(main);
  else if(pid==='cargar') renderCargar(main);
  else if(pid==='mi-mes') renderMiMes(main);
  else if(pid==='mis-tareas') renderMisTareas(main);
  else if(pid==='comentarios-v') renderComentariosV(main);
  else if(pid==='marketing-panel') renderMarketing(main);
  else if(pid==='firmas-panel') renderFirmas(main);
}

          ${total?`<span style="font-size:11px;font-weight:700;color:${info.color}">${vendidoPct}% vendido</span>`:''}
        </div>
        ${total?`
        <div style="height:12px;background:#EBEBEB;border-radius:6px;overflow:hidden;position:relative">
          <div style="height:100%;width:${vendidoPct}%;background:${info.color};border-radius:6px;transition:width .5s"></div>

let dolarMEP = null;

async function fetchDolarMEP(){
  if(dolarMEP) return dolarMEP;
  try{
    const r = await fetch('https://api.bluelytics.com.ar/v2/latest');
    const d = await r.json();
    dolarMEP = d.oficial?.value_sell || 1200;
  } catch(e){
    dolarMEP = 1200; // fallback
  }
  return dolarMEP;
}

async function actualizarDolar(mes){
  const adi=getADI(mes);
  const resc=DB.rescisiones[mes]||{total:0,neteadas:0};
  const precioTip=getPrecioPromTipuana(mes);
  const descuento=resc.neteadas*precioTip*0.5;
  const adiNeto=Math.max(0,adi-descuento);
  try{
    const r = await fetch('https://api.bluelytics.com.ar/v2/latest');
    const d = await r.json();
    const mep = d.blue?.value_sell || d.oficial?.value_sell || 1200;
    const el = document.getElementById('dolar-display');
    const sub = document.getElementById('dolar-sub');
    const adiUsd = document.getElementById('adi-usd');
    const adiNetoUsd = document.getElementById('adineto-usd');
    if(el) el.textContent = 'USD 1 = $' + Math.round(mep).toLocaleString('es-AR');
    if(sub) sub.textContent = 'Dólar blue · Ámbito Financiero · actualizado ahora';
    if(adiUsd) adiUsd.textContent = 'USD ' + Math.round(adi/mep).toLocaleString('es-AR');
    if(adiNetoUsd) adiNetoUsd.textContent = 'Neto: USD ' + Math.round(adiNeto/mep).toLocaleString('es-AR');
  } catch(e){
    const el = document.getElementById('dolar-display');
    if(el) el.textContent = 'No disponible (sin conexión)';
    const sub = document.getElementById('dolar-sub');
    if(sub) sub.textContent = 'Usá el botón para reintentar';
  }
}

function guardarRescisiones(mes){
  const tot=+document.getElementById('r-total').value||0;
  const net=+document.getElementById('r-neteadas').value||0;
  DB.rescisiones[mes]={total:tot,neteadas:net};
  saveDB();
  saveRescision(mes);
  renderFinMes(mes);
}

  return list.map(t=>`
    <div class="task-item">

      <div class="task-body">

function agregarTarea(){
  const txt=document.getElementById('t-texto').value.trim();
  const para=document.getElementById('t-para').value;
  if(!txt)return;
  const tarea={id:Date.now(),texto:txt,para,de:currentUser.name,done:false,fecha:new Date().toISOString().slice(0,10)};
  DB.tareas.push(tarea);
  saveTareaCloud(tarea);
  document.getElementById('t-texto').value='';
  renderTareas(document.getElementById('main-content'));
}

function toggleTarea(id){
  const t=DB.tareas.find(t=>t.id===id);

function renderComList(list){
  if(!list.length) return '<p style="color:var(--gr-m);font-size:13px">Sin comentarios</p>';
  return [...list].reverse().map(c=>`
    <div class="comment-item">
      <div class="comment-who">${c.de} → ${c.para}</div>
      <div class="comment-text">${c.texto}</div>
      <div class="comment-time">${c.fecha}</div>
    </div>
  `).join('');
}

function agregarComentario(){
  const txt=document.getElementById('com-texto').value.trim();
  const para=document.getElementById('com-para').value;
  if(!txt)return;
  const com={id:Date.now(),texto:txt,de:currentUser.name,para,fecha:new Date().toLocaleString('es-AR')};
  DB.comentarios.push(com);
  saveComentarioCloud(com);
  document.getElementById('com-texto').value='';
  showPanel('comentarios');
}

function handleXLDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f) handleXLFile(f); }

function handleXLFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary',cellDates:true});
      processXL(wb,file.name);
    }catch(err){ showXLErr('Error al leer: '+err.message); }
  };
  reader.readAsBinaryString(file);
}

function processXL(wb,fname){
  const MESES_MAP={ENE:'Ene 26',FEB:'Feb 26',MAR:'Mar 26',ABR:'Abr 26',MAY:'May 26',JUN:'Jun 26',JUL:'Jul 26',AGO:'Ago 26'};
  let mesKey=null;
  for(const sn of wb.SheetNames){
    const snU=sn.toUpperCase();
    for(const[k,v] of Object.entries(MESES_MAP)){ if(snU.includes(k)){mesKey=v;break;} }
    if(mesKey)break;
  }
  if(!mesKey){ const fnU=fname.toUpperCase(); for(const[k,v] of Object.entries(MESES_MAP)){ if(fnU.includes(k)){mesKey=v;break;} } }
  if(!mesKey){ showXLErr('No se detectó el mes. Verificá que el nombre del archivo incluya el mes (ej: MAYO 26).'); return; }

  // Procesar ventas por vendedor
  const resumen={Carina:0,Diego:0,Emanuel:0,adi:0};
  const VEND_MAP={'CARINA':'Carina','DIEGO':'Diego','DIEGO ':'Diego','EMANUEL':'Emanuel'};

  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
    let adiAcum=0;
    rows.forEach(row=>{
      if(!row||!row[0])return;
      const vRaw=String(row[0]).trim().toUpperCase();
      const vend=VEND_MAP[vRaw];
      if(vend && ['Carina','Diego','Emanuel'].includes(vend)){
        resumen[vend]=(resumen[vend]||0)+1;
        // ADI: col 9 = INGRESO MENSUAL (% ADI aplicado)
        const adi=row[9]?Number(row[9]):0;
        adiAcum+=adi;
      }
    });
    if(adiAcum>0) resumen.adi+=adiAcum;
  }

  const totalVentas=resumen.Carina+resumen.Diego+resumen.Emanuel;
  if(!totalVentas){ showXLErr('No se encontraron ventas. Verificá el formato.'); return; }

  DB.meses[mesKey]={ventas:[],resumen};
  if(!DB.meses_cargados.includes(mesKey)) DB.meses_cargados.push(mesKey);
  DB.meses_cargados.sort((a,b)=>MESES_ORDER.indexOf(a)-MESES_ORDER.indexOf(b));
  saveDB();
  showXLOk(`✓ ${mesKey} procesado — ${totalVentas} ventas (Carina: ${resumen.Carina}, Diego: ${resumen.Diego}, Emanuel: ${resumen.Emanuel})`);
  renderCargar(document.getElementById('main-content'));
}

function showXLOk(m){ const el=document.getElementById('xl-ok'); el.textContent=m; el.style.display='block'; document.getElementById('xl-err').style.display='none'; setTimeout(()=>el.style.display='none',6000); }
function showXLErr(m){ const el=document.getElementById('xl-err'); el.textContent=m; el.style.display='block'; document.getElementById('xl-ok').style.display='none'; }

function exportarJSON(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));
  a.download='agostini_'+new Date().toISOString().slice(0,10)+'.json'; a.click();

function importarJSON(file){

  const r=new FileReader();
  r.onload=e=>{try{DB=JSON.parse(e.target.result);saveDB();showPanel('resumen');}catch(err){alert('Error al importar: '+err.message);}};

}

function abrirNuevaFirma(){ document.getElementById('modal-firma-nueva').style.display='flex'; }
function cerrarModalFirma(){ document.getElementById('modal-firma-nueva').style.display='none'; }
function abrirCargaFirmas(){ abrirNuevaFirma(); }
function cerrarModalFirmas(){ cerrarModalFirma(); }

function guardarNuevaFirma(){
  const cliente = document.getElementById('nf-cliente').value.trim();
  if(!cliente){ alert('Ingresá el nombre del cliente'); return; }
  const reg = {
    id: Date.now(),
    fecha:  document.getElementById('nf-fecha').value,
    mes:    document.getElementById('nf-mes').value,
    cliente,
    loteo:  document.getElementById('nf-loteo').value,
    escribano: document.getElementById('nf-escribano').value,
    modalidad: document.querySelector('input[name="nf-modalidad"]:checked')?.value||'oficina',
    escribano_externo: document.querySelector('input[name="nf-externo"]:checked')?.value==='si',
    firmo_ok:     document.querySelector('input[name="nf-firmo-ok"]:checked')?.value==='si',
    tuvo_quejas:  document.querySelector('input[name="nf-quejas"]:checked')?.value==='si',
    visito_loteo: document.querySelector('input[name="nf-visita"]:checked')?.value==='si',
    observaciones: document.getElementById('nf-obs').value.trim(),
    cargado_por: currentUser.name,
  };
  const regs = getFirmasRegistros();
  regs.unshift(reg);
  saveFirmasRegistros(regs);
  saveFirmaRegistroCloud(reg);
  cerrarModalFirma();
  renderFirmas(document.getElementById('main-content'));
}

function borrarFirmaRegistro(id){
  if(!confirm('¿Eliminar este registro?')) return;
  const regs = getFirmasRegistros().filter(r=>r.id!==id);
  saveFirmasRegistros(regs);
  deleteFirmaRegistroCloud(id);
  renderFirmas(document.getElementById('main-content'));
}

function tortaSVG(entries, total, colors, size){
  if(!total||!entries.length) return `<svg width="${size}" height="${size}"><text x="${size/2}" y="${size/2}" text-anchor="middle" fill="#ccc" font-size="12">Sin datos</text></svg>`;
  const cx=size/2, cy=size/2, r=size/2-12;
  let ang=-Math.PI/2, slices='';
  entries.forEach(([lbl,val])=>{
    const a=(val/total)*2*Math.PI, ea=ang+a;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(ea),  y2=cy+r*Math.sin(ea);
    const mid=ang+a/2, tx=cx+(r*.65)*Math.cos(mid), ty=cy+(r*.65)*Math.sin(mid);
    const pct=Math.round(val/total*100);
    slices+=`<path d="M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${a>Math.PI?1:0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${colors[lbl]||'#888'}" stroke="white" stroke-width="2"/>`;
    if(pct>=4) slices+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="11" font-weight="bold">${pct}%</text>`;
    ang=ea;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}</svg>`;
}

            <td class="num" style="color:var(--am)">$${Math.round(f.monto).toLocaleString('es-AR')}</td>
            <td style="font-size:12px;color:var(--gr-m)">${f.concepto||'—'}</td>
          </tr>`).join('')}</tbody>
          <tfoot><tr style="background:var(--am-c);font-weight:700"><td>TOTAL</td>
            <td class="num" style="color:var(--am)">$${Math.round((mktData.facturas||[]).reduce((s,f)=>s+f.monto,0)).toLocaleString('es-AR')}</td><td></td>
          </tr></tfoot></table>`:'<p class="hint">Sin facturas cargadas.</p>'}
        <button class="btn-sm btn-sec" style="margin-top:10px;font-size:11px" onclick="abrirCargaMkt('${mes}')">＋ Editar / agregar</button>
      </div>
    </div>

    <div class="card"><div class="card-title">Ventas por loteo ${mes} — contexto campañas</div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Loteo</th><th class="num">Ventas ${mes}</th><th class="num">Meta</th><th>Avance</th></tr></thead>
        <tbody>${(()=>{ensureVPL();const vpl=DB.ventas_por_loteo||{};
          return Object.entries(LOTEOS_TOTALES).map(([key,info])=>{
            const vm=vpl[key]?.vendidos_mes?.[mes]||0; const mt=info.meta_mes||0;
            return `<tr><td><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:${info.color}"></div><strong>${info.nombre}</strong></div></td>
              <td class="num"><strong style="color:${info.color}">${vm}</strong></td>
              <td class="num">${mt||'—'}</td><td style="min-width:150px">${mt?pb(vm,mt):'—'}</td></tr>`;
          }).join('');
        })()}</tbody>
      </table></div>
    </div>

    <div class="card"><div class="card-title">Mis tareas</div>
      ${(()=>{ const p=DB.tareas.filter(t=>!t.done&&(t.para==='marketing'||t.para==='todos'));
        return p.length?p.map(t=>`<div class="task-item"><div class="task-cb" onclick="toggleTarea(${t.id})"></div>
          <div class="task-body"><div class="task-text">${t.texto}</div><div class="task-meta">Asignó: ${t.de} · ${t.fecha}</div></div></div>`).join('')
          :'<div class="alerta alerta-green">✓ Sin tareas pendientes</div>'; })()}
    </div>

    <div id="modal-mkt" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center">
      <div style="background:white;border-radius:16px;padding:28px;width:620px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
          <h3 style="font-size:16px;font-weight:800" id="modal-mkt-titulo">Cargar datos marketing</h3>
          <button onclick="cerrarModalMkt()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--gr-m)">✕</button>
        </div><div id="modal-mkt-body"></div>
      </div>
    </div>
  `;
}

function abrirCargaMkt(mes){
  const d=getMktMes(mes)||{};
  document.getElementById('modal-mkt-titulo').textContent='Cargar datos — '+mes;
  const facts=d.facturas||[];
  document.getElementById('modal-mkt-body').innerHTML=`
    <div style="font-size:11px;font-weight:700;color:var(--gr-m);text-transform:uppercase;margin-bottom:8px">Métricas generales</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
      ${[{id:'leads_total',l:'Leads totales',v:d.leads_total},{id:'meta_leads',l:'Meta leads',v:d.meta_leads||150},
         {id:'inversion_total',l:'Inversión total ($)',v:d.inversion_total},{id:'cpl',l:'CPL ($)',v:d.cpl},
         {id:'piezas',l:'Piezas publicadas',v:d.piezas},{id:'meta_piezas',l:'Meta piezas',v:d.meta_piezas||20}
      ].map(f=>`<div><label style="font-size:11px;color:var(--gr-m);display:block;margin-bottom:3px">${f.l}</label>
        <input type="number" id="cm-${f.id}" value="${f.v||''}" style="width:100%;padding:8px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:13px;font-family:var(--font)"></div>`).join('')}
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--gr-m);text-transform:uppercase;margin-bottom:8px">Contenido</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px">
      ${[{id:'placas',l:'Placas',m:'meta_placas',mv:d.meta_placas||8,v:d.placas},
         {id:'videos',l:'Videos',m:'meta_videos',mv:d.meta_videos||4,v:d.videos},
         {id:'reels',l:'Reels',m:'meta_reels',mv:d.meta_reels||4,v:d.reels},
         {id:'stories',l:'Stories',m:'meta_stories',mv:d.meta_stories||12,v:d.stories}
      ].map(f=>`<div><label style="font-size:10px;color:var(--gr-m);display:block;margin-bottom:3px">${f.l} (meta: <input type="number" id="cm-${f.m}" value="${f.mv}" style="width:32px;border:none;border-bottom:1px solid #ccc;font-size:10px;text-align:center">)</label>
        <input type="number" id="cm-${f.id}" value="${f.v||''}" style="width:100%;padding:7px 8px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:13px;font-family:var(--font)"></div>`).join('')}
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--gr-m);text-transform:uppercase;margin-bottom:8px">Canales</div>
    ${MKT_CANALES.map(c=>{const cd=d.canales?.[c]||{};const ck=c.replace(/\s/g,'_');
      return `<div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr;gap:6px;margin-bottom:7px;align-items:end">
        <div><label style="font-size:11px;color:var(--gr-m);display:block;margin-bottom:2px">${c}</label>
          <select id="cm-ch-${ck}-estado" style="width:100%;padding:7px 8px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
            <option value="">Estado...</option>
            ${['activo','pausado','pendiente','inactivo'].map(s=>`<option value="${s}"${cd.estado===s?' selected':''}>${s}</option>`).join('')}
          </select></div>
        <div><label style="font-size:10px;color:var(--gr-m);display:block;margin-bottom:2px">Leads</label>
          <input type="number" id="cm-ch-${ck}-leads" value="${cd.leads||''}" style="width:100%;padding:7px 8px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)"></div>
        <div><label style="font-size:10px;color:var(--gr-m);display:block;margin-bottom:2px">Inversión $</label>
          <input type="number" id="cm-ch-${ck}-inv" value="${cd.inversion||''}" style="width:100%;padding:7px 8px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)"></div>
        <div><label style="font-size:10px;color:var(--gr-m);display:block;margin-bottom:2px">CPL $</label>
          <input type="number" id="cm-ch-${ck}-cpl" value="${cd.cpl||''}" style="width:100%;padding:7px 8px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)"></div>
        <div><label style="font-size:10px;color:var(--gr-m);display:block;margin-bottom:2px">Objetivo</label>
          <input type="text" id="cm-ch-${ck}-obj" value="${cd.objetivo||''}" style="width:100%;padding:7px 8px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)"></div>
      </div>`;}).join('')}
    <div style="font-size:11px;font-weight:700;color:var(--gr-m);text-transform:uppercase;margin:14px 0 8px">Facturas a medios</div>
    <div id="cm-facturas-list">
      ${facts.map((f,i)=>`<div style="display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:6px;margin-bottom:6px">
        <input type="text" id="cm-fact-${i}-medio" value="${f.medio}" placeholder="Medio" style="padding:7px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
        <input type="number" id="cm-fact-${i}-monto" value="${f.monto}" placeholder="$" style="padding:7px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
        <input type="text" id="cm-fact-${i}-concepto" value="${f.concepto||''}" placeholder="Concepto" style="padding:7px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
        <button onclick="this.parentElement.remove()" style="padding:7px 10px;background:var(--ro-c);color:var(--ro);border:none;border-radius:7px;cursor:pointer">✕</button>
      </div>`).join('')}
    </div>
    <button onclick="agregarFilaFactura()" class="btn-sm btn-sec" style="font-size:11px;margin-bottom:18px">＋ Factura</button>
    <button class="btn-sm" onclick="guardarMkt('${mes}')" style="width:100%;padding:13px;font-size:14px">Guardar ${mes}</button>
  `;
  document.getElementById('modal-mkt').style.display='flex';
}

function agregarFilaFactura(){
  const list=document.getElementById('cm-facturas-list');
  const i=Date.now(); const div=document.createElement('div');
  div.style.cssText='display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:6px;margin-bottom:6px';
  div.innerHTML=`
    <input type="text" id="cm-fact-${i}-medio" placeholder="Medio" style="padding:7px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
    <input type="number" id="cm-fact-${i}-monto" placeholder="$" style="padding:7px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
    <input type="text" id="cm-fact-${i}-concepto" placeholder="Concepto" style="padding:7px 10px;border:1.5px solid #E4E4E4;border-radius:7px;font-size:12px;font-family:var(--font)">
    <button onclick="this.parentElement.remove()" style="padding:7px 10px;background:var(--ro-c);color:var(--ro);border:none;border-radius:7px;cursor:pointer">✕</button>
  `;
  list.appendChild(div);
}

function guardarMkt(mes){
  const canales={};
  MKT_CANALES.forEach(c=>{const k=c.replace(/\s/g,'_');
    canales[c]={estado:document.getElementById(`cm-ch-${k}-estado`)?.value||'',
      leads:+document.getElementById(`cm-ch-${k}-leads`)?.value||0,
      inversion:+document.getElementById(`cm-ch-${k}-inv`)?.value||0,
      cpl:+document.getElementById(`cm-ch-${k}-cpl`)?.value||0,
      objetivo:document.getElementById(`cm-ch-${k}-obj`)?.value||''};
  });
  const facturas=[];
  document.querySelectorAll('#cm-facturas-list > div').forEach(row=>{
    const ids=row.querySelectorAll('input');
    const medio=ids[0]?.value; const monto=+ids[1]?.value||0; const concepto=ids[2]?.value||'';
    if(medio) facturas.push({medio,monto,concepto});
  });
  const data = {
    leads_total:+document.getElementById('cm-leads_total')?.value||0,
    meta_leads:+document.getElementById('cm-meta_leads')?.value||150,
    inversion_total:+document.getElementById('cm-inversion_total')?.value||0,
    cpl:+document.getElementById('cm-cpl')?.value||0,
    piezas:+document.getElementById('cm-piezas')?.value||0,
    meta_piezas:+document.getElementById('cm-meta_piezas')?.value||20,
    placas:+document.getElementById('cm-placas')?.value||0,
    videos:+document.getElementById('cm-videos')?.value||0,
    reels:+document.getElementById('cm-reels')?.value||0,
    stories:+document.getElementById('cm-stories')?.value||0,
    meta_placas:+document.getElementById('cm-meta_placas')?.value||8,
    meta_videos:+document.getElementById('cm-meta_videos')?.value||4,
    meta_reels:+document.getElementById('cm-meta_reels')?.value||4,
    meta_stories:+document.getElementById('cm-meta_stories')?.value||12,
    canales, facturas, cargado:true,
  };
  saveMktMes(mes, data);
  saveMktCloud(mes, data);
  cerrarModalMkt();
  renderMarketing(document.getElementById('main-content'));
}
function cerrarModalMkt(){ document.getElementById('modal-mkt').style.display='none'; }

// ══════════════════════════════════════════════════════════

// Enter para login
document.getElementById('login-pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
